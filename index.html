<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/dist/css/home-page.css" />
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</head>

<body>
    <div class="">
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom p-0">
            <div class="container-fluid">
                <span></span>
                <button class="navbar-toggler my-2" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse border-top" id="navbarSupportedContent">
                    <ul class="navbar-nav bg-light py-1">
                        <li class="nav-item position-relative">
                            <div class="drop-down">
                                <button type="button"
                                    class="dropdown-toggle btn px-3 d-flex align-items-center w-100 gap-1 border-0"
                                    aria-label="menu" data-bs-toggle="dropdown">
                                    <iconify-icon icon="bitcoin-icons:plus-filled"
                                        class="fs-5 text-pink"></iconify-icon>
                                    <span>New</span>
                                    <iconify-icon icon="oui:arrow-down" class="fs-6"></iconify-icon>
                                </button>

                                <ul class="dropdown-menu">
                                    <li>
                                        <button class="dropdown-item d-flex align-items-center gap-2" type="button"
                                            id="newFolderBtn">
                                            <iconify-icon icon="flat-color-icons:folder" class="fs-5"></iconify-icon>
                                            <span>New Folder</span>
                                        </button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item d-flex align-items-center gap-2" type="button"
                                            id="newFileBtn">
                                            <iconify-icon icon="streamline-color:new-file-flat"
                                                class="fs-5"></iconify-icon>
                                            <span>New File</span>
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </li>

                        <li class="nav-item position-relative">
                            <div class="drop-down">
                                <button type="button"
                                    class="dropdown-toggle btn px-3 d-flex align-items-center w-100 gap-1 border-0"
                                    aria-label="menu" data-bs-toggle="dropdown">
                                    <iconify-icon icon="fluent-mdl2:upload" class="fs-5 text-pink"></iconify-icon>
                                    <span>Upload</span>
                                    <iconify-icon icon="oui:arrow-down" class="fs-6"></iconify-icon>
                                </button>

                                <ul class="dropdown-menu">
                                    <li>
                                        <label for="fileUploadBtn" role="button"
                                            class="dropdown-item d-flex align-items-center gap-2">
                                            <iconify-icon icon="streamline-color:new-file-flat"
                                                class="fs-5"></iconify-icon>
                                            <span>Upload File</span>
                                        </label>

                                        <input type="file" id="fileUploadBtn" multiple class="d-none" />
                                    </li>
                                </ul>
                            </div>
                        </li>

                        <li class="nav-item ">
                            <button type="button" class="btn px-3 d-flex align-items-center w-100 gap-2 border-0"
                                aria-label="menu">
                                <iconify-icon icon="fluent-mdl2:sync-to-p-c" class="fs-5 text-pink"></iconify-icon>
                                <span>Sync</span>
                            </button>
                        </li>

                        <li class="nav-item">
                            <button type="button" class="btn px-3 d-flex align-items-center w-100 gap-1 border-0">
                                <iconify-icon icon="vscode-icons:file-type-excel2" class="fs-5"></iconify-icon>
                                <span>
                                    Export to Excel
                                </span>
                            </button>
                        </li>

                        <li class="nav-item ">
                            <button type="button" class="btn px-3 d-flex align-items-center w-100 gap-1 border-0"
                                aria-label="menu">
                                <iconify-icon icon="fluent:flow-20-regular" class="fs-5 text-pink"></iconify-icon>
                                <span>Flow</span>
                                <iconify-icon icon="oui:arrow-down" class="fs-6"></iconify-icon>
                            </button>
                        </li>

                        <li class="nav-item ">
                            <button type="button" class="btn px-3 d-flex align-items-center w-100 gap-1 border-0"
                                aria-label="menu">
                                <iconify-icon icon="mynaui:dots-solid" class="fs-3"></iconify-icon>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="mt-4 container-fluid">
            <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <!-- Render breadcrumbs through JS (_grid.ts) -->
                </ol>
            </nav>

            <table class="table table-hover">
                <thead>
                    <tr>
                        <!-- Empty th for selection box -->
                        <th></th>
                        <th class="d-flex align-items-center justify-content-end">
                            <iconify-icon icon="fluent:document-20-regular" class="fs-4
                            "></iconify-icon>
                        </th>

                        <th class="fw-normal">
                            <div class="d-flex align-items-center gap-1">
                                <span>Name</span>
                                <iconify-icon icon="oui:arrow-down" class="fs-6"></iconify-icon>
                            </div>
                        </th>

                        <th class="fw-normal">
                            <div class="d-flex align-items-center gap-1">
                                <span>Modified</span>
                                <iconify-icon icon="oui:arrow-down" class="fs-6"></iconify-icon>
                            </div>
                        </th>

                        <th class="fw-normal">
                            <div class="d-flex align-items-center gap-1">
                                <span>Modified By</span>
                                <iconify-icon icon="oui:arrow-down" class="fs-6"></iconify-icon>
                            </div>
                        </th>

                        <th class="fw-normal">
                            <div class="d-flex align-items-center gap-1">
                                <iconify-icon icon="bitcoin-icons:plus-filled" class="fs-5"></iconify-icon>
                                <span>Add column</span>
                            </div>
                        </th>
                    </tr>
                </thead>

                <tbody class="table-body table-group-divider">
                    <!-- Render data through JS (_grid.ts) -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="/dist/js/home-page.js"></script>
</body>

</html>
